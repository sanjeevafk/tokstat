[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokstat"
version = "0.1.0"
description = "AI Developer Telemetry Observatory & Token Tracker"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "sanjeevafk" }
]
keywords = ["ai", "telemetry", "tokens", "observability", "dashboard", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fpdf2>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
tokstat = "tokstat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tokstat"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["ref"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
